---
openapi: 3.1.0
info:
  title: Eazybe Meta API Documentation
  version: 1.0.0
  description: |
    A single authenticated Eazybe REST surface over WhatsApp Business Cloud API.
    The wrapper uses the Meta credentials captured when a WABA is connected to
    Eazybe, so callers never send Meta access tokens directly.
servers:
- url: https://cerberus.eazybe.com/prod/api/v2
  description: Eazybe prod API v2.
security:
- bearerAuth: []
tags:
- name: Phone numbers
  description: Discover connected WABAs and phone-number IDs.
- name: Messaging
  description: Send WhatsApp messages and update message state.
- name: Templates
  description: Manage WhatsApp message templates.
- name: Media
  description: Upload, inspect, and delete WhatsApp media.
- name: Webhooks
  description: Manage WABA webhook subscriptions.
- name: Analytics
  description: Read messaging, conversation, pricing, and template analytics.
- name: Profiles and settings
  description: Manage business profiles and phone-number settings.
- name: Automation
  description: Configure welcome messages, ice-breakers, and commands.
- name: QR codes
  description: Manage click-to-chat QR codes.
- name: Flows
  description: Manage the WhatsApp Flows lifecycle.
- name: Number administration
  description: Register numbers, manage PINs, and synchronize coexistence data.
- name: Block list
  description: List, block, and unblock WhatsApp users.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Eazybe token
      description: |
        Eazybe bearer token. The token resolves the caller's organization and
        must be kept on the server.
  parameters:
    PhoneNumberId:
      name: phoneNumberId
      in: path
      required: true
      description: Meta phone-number ID returned by `GET /meta/phone-numbers`.
      schema:
        type: string
      example: '5647382910'
    WabaId:
      name: wabaId
      in: path
      required: true
      description: WhatsApp Business Account ID returned by `GET /meta/phone-numbers`.
      schema:
        type: string
      example: '1029384756'
    Fields:
      name: fields
      in: query
      required: false
      description: Comma-separated Graph API fields. Omit to use the endpoint defaults.
      schema:
        type: string
    PagingLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return in one Meta page.
      schema:
        type: integer
        minimum: 1
    PagingAfter:
      name: after
      in: query
      required: false
      description: Meta paging cursor from the previous response.
      schema:
        type: string
  responses:
    BadRequest:
      description: Meta rejected the request or a required value is invalid.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: The Eazybe bearer token is missing, invalid, or expired.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        The requested WABA or phone number is not connected to the authenticated
        organization, or its connection needs authorization.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Meta rate or usage limits were reached. Retry with exponential
        backoff.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: Meta was unreachable or did not respond within 15 seconds.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    MetaObject:
      type: object
      description: A WhatsApp Cloud API object passed through from Meta.
      additionalProperties: true
    MetaResponse:
      type: object
      description: A successful response passed through from WhatsApp Cloud API.
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        status:
          type: boolean
          const: false
        message:
          type: string
        error:
          type: object
          additionalProperties: true
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: integer
              description: Meta error code. Use this value for programmatic handling.
            error_subcode:
              type: integer
            fbtrace_id:
              type: string
      required:
      - status
      - message
      example:
        status: false
        message: Template name does not exist in the translation
        error:
          message: Template name does not exist in the translation
          type: OAuthException
          code: 132001
          error_subcode: 2494010
          fbtrace_id: A1bC2dE3fG4
    PhoneNumber:
      type: object
      properties:
        id:
          type: string
          description: Use as `phoneNumberId` in phone-number routes.
        display_phone_number:
          type: string
        verified_name:
          type: string
        quality_rating:
          type: string
          enum:
          - GREEN
          - YELLOW
          - RED
          - UNKNOWN
        code_verification_status:
          type: string
        status:
          type: string
      required:
      - id
      - display_phone_number
    WabaAccount:
      type: object
      properties:
        waba_id:
          type: string
          description: Use as `wabaId` in WABA routes.
        status:
          type: boolean
        phone_numbers:
          type: array
          items:
            "$ref": "#/components/schemas/PhoneNumber"
        error:
          type: string
          description: Present when this WABA needs to be reconnected.
      required:
      - waba_id
      - status
    PhoneNumberListResponse:
      type: object
      properties:
        status:
          type: boolean
        status_code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            total_wabas:
              type: integer
            successful:
              type: integer
            failed:
              type: integer
            accounts:
              type: array
              items:
                "$ref": "#/components/schemas/WabaAccount"
          required:
          - total_wabas
          - successful
          - failed
          - accounts
      required:
      - status
      - status_code
      - message
      - data
    MessageTemplate:
      type: object
      properties:
        name:
          type: string
        language:
          type: object
          properties:
            code:
              type: string
          required:
          - code
        components:
          type: array
          items:
            "$ref": "#/components/schemas/MetaObject"
      required:
      - name
      - language
    SendTemplateRequest:
      type: object
      properties:
        to:
          type: string
          pattern: "^[0-9]+$"
          description: Recipient in international format without `+` or spaces.
          example: '919900000001'
        template:
          "$ref": "#/components/schemas/MessageTemplate"
      required:
      - to
      - template
    FreeFormRequest:
      type: object
      properties:
        to:
          type: string
          pattern: "^[0-9]+$"
          example: '919900000001'
        text:
          type: string
        previewUrl:
          type: boolean
          default: false
      required:
      - to
      - text
    BulkTemplateRequest:
      type: object
      properties:
        template:
          "$ref": "#/components/schemas/MessageTemplate"
        recipients:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              to:
                type: string
                pattern: "^[0-9]+$"
              components:
                type: array
                description: Overrides `template.components` for this recipient.
                items:
                  "$ref": "#/components/schemas/MetaObject"
            required:
            - to
        concurrency:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        marketing:
          type: boolean
          default: false
          description: Route the whole batch through the MM Lite marketing path.
      required:
      - template
      - recipients
    BulkTemplateResponse:
      type: object
      properties:
        total:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              to:
                type: string
              status:
                type: boolean
              data:
                "$ref": "#/components/schemas/MetaObject"
              error:
                type: string
      required:
      - total
      - successful
      - failed
      - results
    MessageIdRequest:
      type: object
      properties:
        messageId:
          type: string
          description: WhatsApp message ID (`wamid`).
      required:
      - messageId
    TemplateDefinition:
      type: object
      properties:
        name:
          type: string
        language:
          type: string
          example: en
        category:
          type: string
          enum:
          - AUTHENTICATION
          - MARKETING
          - UTILITY
        components:
          type: array
          items:
            "$ref": "#/components/schemas/MetaObject"
      required:
      - name
      - language
      - category
      - components
    BusinessProfile:
      type: object
      properties:
        about:
          type: string
        address:
          type: string
        description:
          type: string
        email:
          type: string
          format: email
        profile_picture_url:
          type: string
          format: uri
        websites:
          type: array
          items:
            type: string
            format: uri
        vertical:
          type: string
    WebhookSubscriptionRequest:
      type: object
      properties:
        overrideCallbackUri:
          type: string
          format: uri
          description: Public HTTPS URL that receives Meta webhook events.
        verifyToken:
          type: string
          description: Shared secret used during Meta callback verification.
      description: |
        Send both fields to use a custom callback. Send an empty object to use
        the default Eazybe callback.
    AutomationSettings:
      type: object
      properties:
        enable_welcome_message:
          type: boolean
        prompts:
          type: array
          description: Ice-breakers shown before the first message.
          items:
            type: string
        commands:
          type: array
          items:
            type: object
            properties:
              command_name:
                type: string
              command_description:
                type: string
            required:
            - command_name
            - command_description
    WaIdList:
      type: object
      properties:
        waIds:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[0-9]+$"
      required:
      - waIds
paths:
  "/meta/phone-numbers":
    get:
      operationId: getPhoneNumbers
      summary: List connected phone numbers
      description: |
        Lists every WhatsApp Business Account and phone number connected to the
        authenticated Eazybe organization. Use the returned IDs in all other
        Meta wrapper routes.
      tags:
      - Phone numbers
      x-mint:
        href: "/api-reference/meta/operations/get-phone-numbers"
        content: "<Tip>Start here. This request verifies your token and returns the
          `wabaId` and `phoneNumberId` values used by the rest of the API.</Tip>\n"
      responses:
        '200':
          description: |-
            Phone numbers fetched (may include per-WABA failures)

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `400` | Token resolved to a user with no organization | Fix the user's org assignment |
            | `404` | No connected WABA account found for this organization | Complete WABA embedded signup |
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                - data
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required:
                    - total_wabas
                    - successful
                    - failed
                    - accounts
                    properties:
                      total_wabas:
                        type: integer
                      successful:
                        type: integer
                      failed:
                        type: integer
                      accounts:
                        type: array
                        items:
                          type: object
                          required:
                          - waba_id
                          - status
                          - phone_numbers
                          properties:
                            waba_id:
                              type: string
                            status:
                              type: boolean
                            phone_numbers:
                              type: array
                              items:
                                type: object
                                required:
                                - id
                                - display_phone_number
                                - verified_name
                                - quality_rating
                                - code_verification_status
                                - status
                                properties:
                                  id:
                                    type: string
                                  display_phone_number:
                                    type: string
                                  verified_name:
                                    type: string
                                  quality_rating:
                                    type: string
                                  code_verification_status:
                                    type: string
                                  status:
                                    type: string
              example:
                status: true
                message: Meta phone numbers fetched successfully
                data:
                  total_wabas: 2
                  successful: 1
                  failed: 1
                  accounts:
                  - waba_id: '1029384756'
                    status: true
                    phone_numbers:
                    - id: '5647382910'
                      display_phone_number: "+91 99000 00000"
                      verified_name: Acme Support
                      quality_rating: GREEN
                      code_verification_status: VERIFIED
                      status: CONNECTED
                  - waba_id: '2938475610'
                    status: false
                    phone_numbers: []
                    error: 'Error validating access token: Session has expired.'
  "/meta/phone-numbers/{phoneNumberId}/details":
    get:
      operationId: getPhoneNumberDetails
      summary: Get phone-number details
      description: Returns the number's display name, status, quality rating, and
        verification details.
      tags:
      - Phone numbers
      x-mint:
        href: "/api-reference/meta/operations/get-phone-number-details"
      parameters:
      - "$ref": "#/components/parameters/PhoneNumberId"
      - "$ref": "#/components/parameters/Fields"
      responses:
        '200':
          description: |-
            Details returned

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `phoneNumberId` is not linked to your organization | Verify the id from `GET /meta/phone-numbers` |
            | `400` | Invalid `fields` expression | Correct the field list |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - display_phone_number
                - verified_name
                - quality_rating
                - code_verification_status
                - status
                properties:
                  id:
                    type: string
                  display_phone_number:
                    type: string
                  verified_name:
                    type: string
                  quality_rating:
                    type: string
                  code_verification_status:
                    type: string
                  status:
                    type: string
              example:
                id: '5647382910'
                display_phone_number: "+91 99000 00000"
                verified_name: Acme Support
                quality_rating: GREEN
                code_verification_status: VERIFIED
                status: CONNECTED
  "/meta/wabas/{wabaId}/details":
    get:
      operationId: getWabaDetails
      summary: Get WABA details
      description: Returns details such as the WABA name, timezone, and template namespace.
      tags:
      - Phone numbers
      x-mint:
        href: "/api-reference/meta/operations/get-waba-details"
      parameters:
      - "$ref": "#/components/parameters/WabaId"
      - "$ref": "#/components/parameters/Fields"
      responses:
        '200':
          description: |-
            Details returned

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` is not linked to your organization | Verify the id from `GET /meta/phone-numbers` |
            | `400` | Invalid `fields` expression | Correct the field list |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - timezone_id
                - message_template_namespace
                - marketing_messages_onboarding_status
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  timezone_id:
                    type: string
                  message_template_namespace:
                    type: string
                  marketing_messages_onboarding_status:
                    type: string
              example:
                id: '1029384756'
                name: Acme Retail
                timezone_id: '58'
                message_template_namespace: a1b2c3d4_e5f6_7890_abcd_ef1234567890
                marketing_messages_onboarding_status: ONBOARDED
  "/meta/phone-numbers/{phoneNumberId}/messages":
    post:
      operationId: sendMessage
      summary: Send any supported message type
      description: |
        Sends a raw WhatsApp Cloud API message object. Use this route for image,
        document, video, audio, sticker, location, and interactive messages.
        Eazybe adds `messaging_product: whatsapp` automatically.
      tags:
      - Messaging
      x-mint:
        href: "/api-reference/meta/operations/send-message"
        content: "<Note>Free-form message types are available only inside the 24-hour
          customer-service window. Use an approved template outside that window.</Note>\n"
      parameters:
      - "$ref": "#/components/parameters/PhoneNumberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              - type
              - image
              properties:
                to:
                  type: string
                type:
                  type: string
                image:
                  type: object
                  required:
                  - id
                  - caption
                  properties:
                    id:
                      type: string
                    caption:
                      type: string
              description: |-
                ```json
                {
                  "to": "919900000001",
                  "type": "image",
                  "image": {
                    "id": "1234567890123456",
                    "caption": "Your invoice"
                  }
                }
                ```
            example:
              to: '919900000001'
              type: image
              image:
                id: '1234567890123456'
                caption: Your invoice
      responses:
        '200':
          description: |-
            Message accepted for delivery

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `phoneNumberId` not linked to your organization | Verify the id |
            | `500` | Gateway rejected the send — malformed message object, unopted-in recipient, closed 24-hour window, or rate limit | Read `message`; check server logs for the upstream body |
          content:
            application/json:
              schema:
                type: object
                required:
                - messaging_product
                - contacts
                - messages
                properties:
                  messaging_product:
                    type: string
                  contacts:
                    type: array
                    items:
                      type: object
                      required:
                      - input
                      - wa_id
                      properties:
                        input:
                          type: string
                        wa_id:
                          type: string
                  messages:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - message_status
                      properties:
                        id:
                          type: string
                        message_status:
                          type: string
              example:
                messaging_product: whatsapp
                contacts:
                - input: '919900000001'
                  wa_id: '919900000001'
                messages:
                - id: wamid.HBgMOTE5OTAwMDAwMDAxFQIAERgSN0EyRjc4...
                  message_status: accepted
  "/meta/phone-numbers/{phoneNumberId}/messages/template":
    post:
      operationId: sendTemplateMessage
      summary: Send a template message
      description: Sends an approved utility, authentication, or marketing template
        to one recipient.
      tags:
      - Messaging
      x-mint:
        href: "/api-reference/meta/operations/send-template-message"
        content: "<Tip>Confirm the template is `APPROVED` before sending. New templates
          begin in `PENDING` state.</Tip>\n"
      parameters:
      - "$ref": "#/components/parameters/PhoneNumberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              - template
              properties:
                to:
                  type: string
                template:
                  type: object
                  required:
                  - name
                  - language
                  - components
                  properties:
                    name:
                      type: string
                    language:
                      type: object
                      required:
                      - code
                      properties:
                        code:
                          type: string
                    components:
                      type: array
                      items:
                        type: object
                        required:
                        - type
                        - parameters
                        properties:
                          type:
                            type: string
                          parameters:
                            type: array
                            items:
                              type: object
                              required:
                              - type
                              - text
                              properties:
                                type:
                                  type: string
                                text:
                                  type: string
              description: |-
                ```json
                {
                  "to": "919900000001",
                  "template": {
                    "name": "order_update",
                    "language": {
                      "code": "en"
                    },
                    "components": [
                      {
                        "type": "body",
                        "parameters": [
                          {
                            "type": "text",
                            "text": "Ravi"
                          }
                        ]
                      }
                    ]
                  }
                }
                ```
            example:
              to: '919900000001'
              template:
                name: order_update
                language:
                  code: en
                components:
                - type: body
                  parameters:
                  - type: text
                    text: Ravi
      responses:
        '200':
          description: |-
            Template accepted for delivery

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `phoneNumberId` not linked to your organization | Verify the id |
            | `500` | Template name/language not found, template not approved, or parameter count mismatch | Confirm the template is `APPROVED` and parameters match |
          content:
            application/json:
              schema:
                type: object
                required:
                - messaging_product
                - contacts
                - messages
                properties:
                  messaging_product:
                    type: string
                  contacts:
                    type: array
                    items:
                      type: object
                      required:
                      - input
                      - wa_id
                      properties:
                        input:
                          type: string
                        wa_id:
                          type: string
                  messages:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - message_status
                      properties:
                        id:
                          type: string
                        message_status:
                          type: string
              example:
                messaging_product: whatsapp
                contacts:
                - input: '919900000001'
                  wa_id: '919900000001'
                messages:
                - id: wamid.HBgMOTE5OTAwMDAwMDAxFQIAERgSN0EyRjc4...
                  message_status: accepted
  "/meta/phone-numbers/{phoneNumberId}/messages/marketing-template":
    post:
      operationId: sendMarketingTemplateMessage
      summary: Send a marketing template
      description: |
        Sends a template through Meta's MM Lite marketing route. The connected
        WABA must be onboarded to MM Lite.
      tags:
      - Messaging
      x-mint:
        href: "/api-reference/meta/operations/send-marketing-template"
      parameters:
      - "$ref": "#/components/parameters/PhoneNumberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              - template
              properties:
                to:
                  type: string
                template:
                  type: object
                  required:
                  - name
                  - language
                  - components
                  properties:
                    name:
                      type: string
                    language:
                      type: object
                      required:
                      - code
                      properties:
                        code:
                          type: string
                    components:
                      type: array
                      items:
                        type: object
                        required:
                        - type
                        - parameters
                        properties:
                          type:
                            type: string
                          parameters:
                            type: array
                            items:
                              type: object
                              required:
                              - type
                              - text
                              properties:
                                type:
                                  type: string
                                text:
                                  type: string
              description: |-
                ```json
                {
                  "to": "919900000001",
                  "template": {
                    "name": "diwali_offer",
                    "language": {
                      "code": "en"
                    },
                    "components": [
                      {
                        "type": "body",
                        "parameters": [
                          {
                            "type": "text",
                            "text": "30%"
                          }
                        ]
                      }
                    ]
                  }
                }
                ```
            example:
              to: '919900000001'
              template:
                name: diwali_offer
                language:
                  code: en
                components:
                - type: body
                  parameters:
                  - type: text
                    text: 30%
      responses:
        '200':
          description: |-
            Marketing template accepted

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `phoneNumberId` not linked to your organization | Verify the id |
            | `500` | WABA not onboarded to MM Lite, template not `MARKETING`, or marketing limit reached | Check `marketing_messages_onboarding_status` via `GET /meta/wabas/{wabaId}/details` |
          content:
            application/json:
              schema:
                type: object
                required:
                - messaging_product
                - contacts
                - messages
                properties:
                  messaging_product:
                    type: string
                  contacts:
