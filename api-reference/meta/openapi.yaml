  "/meta/phone-numbers/{phoneNumberId}/messages/template/bulk":
    post:
      operationId: sendBulkTemplateMessages
      summary: Send a template in bulk
      description: |
        Sends one template to multiple recipients with optional per-recipient
        components. The request returns a result for every recipient.
      tags:
      - Messaging
      x-mint:
        href: "/api-reference/meta/operations/send-bulk-template"
        content: "<Warning>A `200` response can include recipient failures. Always
          inspect `failed` and every item in `results[]`.</Warning>\n"
      parameters:
      - "$ref": "#/components/parameters/PhoneNumberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - template
              - recipients
              - concurrency
              - marketing
              properties:
                template:
                  type: object
                  required:
                  - name
                  - language
                  properties:
                    name:
                      type: string
                    language:
                      type: object
                      required:
                      - code
                      properties:
                        code:
                          type: string
                recipients:
                  type: array
                  items:
                    type: object
                    required:
                    - to
                    - components
                    properties:
                      to:
                        type: string
                      components:
                        type: array
                        items:
                          type: object
                          required:
                          - type
                          - parameters
                          properties:
                            type:
                              type: string
                            parameters:
                              type: array
                              items:
                                type: object
                                required:
                                - type
                                - text
                                properties:
                                  type:
                                    type: string
                                  text:
                                    type: string
                concurrency:
                  type: integer
                marketing:
                  type: boolean
              description: |-
                ```json
                {
                  "template": {
                    "name": "order_update",
                    "language": {
                      "code": "en"
                    }
                  },
                  "recipients": [
                    {
                      "to": "919900000001",
                      "components": [
                        {
                          "type": "body",
                          "parameters": [
                            {
                              "type": "text",
                              "text": "Ravi"
                            }
                          ]
                        }
                      ]
                    },
                    {
                      "to": "919900000002",
                      "components": [
                        {
                          "type": "body",
                          "parameters": [
                            {
                              "type": "text",
                              "text": "Priya"
                            }
                          ]
                        }
                      ]
                    },
                    {
                      "to": "919900000003"
                    }
                  ],
                  "concurrency": 10,
                  "marketing": false
                }
                ```
            example:
              template:
                name: order_update
                language:
                  code: en
              recipients:
              - to: '919900000001'
                components:
                - type: body
                  parameters:
                  - type: text
                    text: Ravi
              - to: '919900000002'
                components:
                - type: body
                  parameters:
                  - type: text
                    text: Priya
              - to: '919900000003'
              concurrency: 10
              marketing: false
      responses:
        '200':
          description: |-
            Batch processed (check `successful` / `failed`)

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `phoneNumberId` not linked to your organization | Verify the id |
            | `400` | DTO validation failed — empty `recipients`, `concurrency` outside 1–50, non-object `template`, or an unknown property | Read the `message` array |
            | `500` | The whole batch failed before per-recipient handling | Retry the batch |
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - successful
                - failed
                - results
                properties:
                  total:
                    type: integer
                  successful:
                    type: integer
                  failed:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - to
                      - status
                      - data
                      properties:
                        to:
                          type: string
                        status:
                          type: boolean
                        data:
                          type: object
                          required:
                          - messaging_product
                          - contacts
                          - messages
                          properties:
                            messaging_product:
                              type: string
                            contacts:
                              type: array
                              items:
                                type: object
                                required:
                                - input
                                - wa_id
                                properties:
                                  input:
                                    type: string
                                  wa_id:
                                    type: string
                            messages:
                              type: array
                              items:
                                type: object
                                required:
                                - id
                                - message_status
                                properties:
                                  id:
                                    type: string
                                  message_status:
                                    type: string
              example:
                total: 3
                successful: 2
                failed: 1
                results:
                - to: '919900000001'
                  status: true
                  data:
                    messaging_product: whatsapp
                    contacts:
                    - input: '919900000001'
                      wa_id: '919900000001'
                    messages:
                    - id: wamid.HBgMOTE5OTAwMDAwMDAx...
                      message_status: accepted
                - to: '919900000002'
                  status: true
                  data:
                    messaging_product: whatsapp
                    contacts:
                    - input: '919900000002'
                      wa_id: '919900000002'
                    messages:
                    - id: wamid.HBgMOTE5OTAwMDAwMDAy...
                      message_status: accepted
                - to: '919900000003'
                  status: false
                  error: Request failed with status code 400
