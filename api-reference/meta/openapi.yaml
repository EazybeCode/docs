  "/meta/wabas/{wabaId}/flows/{flowId}/assets":
    post:
      operationId: uploadFlowAsset
      summary: Upload a Flow JSON asset
      description: Uploads the JSON definition used by a Flow.
      tags:
      - Flows
      x-mint:
        href: "/api-reference/meta/operations/upload-flow-asset"
      parameters:
      - "$ref": "#/components/parameters/WabaId"
      - name: flowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  default: flow.json
                assetType:
                  type: string
                  default: FLOW_JSON
              required:
              - file
              description: |-
                ```bash
                curl -X POST "https://cerberus.eazybe.com/meta/wabas/1029384756/flows/556677889900/assets" \
                  -H "Authorization: Bearer <jwt>" \
                  -F "file=@flow.json" \
                  -F "name=flow.json" \
                  -F "assetType=FLOW_JSON"
                ```
      responses:
        '200':
          description: |-
            Asset uploaded — **check `validation_errors`**

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `400` | Flow is published (assets locked), or unparseable JSON | Upload to a draft flow |
            | `500` | No `file` field in the multipart body | Send as `multipart/form-data` with field `file` |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - validation_errors
                properties:
                  success:
                    type: boolean
                  validation_errors:
                    type: array
                    items: {}
              example:
                success: true
                validation_errors: []
