          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  - language
                  - status
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    language:
                      type: string
                    status:
                      type: string
              example:
              - id: '778899001122'
                name: order_update
                language: en
                status: APPROVED
              - id: '778899001123'
                name: diwali_offer
                language: en
                status: APPROVED
              - id: '778899001124'
                name: payment_reminder
                language: en
                status: PENDING
  "/meta/wabas/{wabaId}/templates/library":
