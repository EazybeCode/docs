  "/meta/wabas/{wabaId}/templates/migrate":
    post:
      operationId: migrateTemplates
      summary: Migrate templates from another WABA
      description: Copies eligible templates from a source WABA into the connected
        destination WABA.
      tags:
      - Templates
      x-mint:
        href: "/api-reference/meta/operations/migrate-templates"
      parameters:
      - "$ref": "#/components/parameters/WabaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sourceWabaId
              - pageNumber
              properties:
                sourceWabaId:
                  type: string
                pageNumber:
                  type: integer
              description: |-
                ```json
                {
                  "sourceWabaId": "1122334455",
                  "pageNumber": 0
                }
                ```
            example:
              sourceWabaId: '1122334455'
              pageNumber: 0
      responses:
        '200':
          description: |-
            Migration page processed

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | Destination `wabaId` not linked to your organization | Verify the id |
            | `400` | `sourceWabaId` not owned by the same business, or not accessible | Confirm both WABAs sit under one business |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - migrated_templates
                - failed_templates
                properties:
                  migrated_templates:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                  failed_templates:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - reason
                      properties:
                        name:
                          type: string
                        reason:
                          type: string
              example:
                migrated_templates:
                - id: '778899001127'
                  name: order_update
                - id: '778899001128'
                  name: payment_reminder
                failed_templates:
                - name: old_promo
                  reason: TEMPLATE_NAME_ALREADY_EXISTS
  "/meta/wabas/{wabaId}/templates/compare":
    get:
      operationId: compareTemplates
      summary: Compare template performance
      description: Compares one template's performance with one or more other templates.
      tags:
      - Templates
      x-mint:
        href: "/api-reference/meta/operations/compare-templates"
      parameters:
      - "$ref": "#/components/parameters/WabaId"
      - name: templateId
        in: query
        required: true
        description: Template ID used as the comparison baseline.
        schema:
          type: string
      - name: comparedTo
        in: query
        required: true
        description: Comma-separated template IDs to compare with the baseline.
        schema:
          type: string
      - name: start
        in: query
        required: false
        description: Start of the comparison range in Unix seconds.
        schema:
          type: integer
      - name: end
        in: query
        required: false
        description: End of the comparison range in Unix seconds.
        schema:
          type: integer
      responses:
        '200':
          description: |-
            Comparison returned

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `400` | Missing/invalid `start` or `end`, or templates not comparable (different category or language) | Compare templates of the same category |
            | `500` | `comparedTo` omitted from the query | Always send `comparedTo` |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - compared_to
                      - start
                      - end
                      - metrics
                      properties:
                        compared_to:
                          type: string
                        start:
                          type: integer
                        end:
                          type: integer
                        metrics:
                          type: array
                          items:
                            type: object
                            required:
                            - type
                            - order
                            - values
                            properties:
                              type:
                                type: string
                              order:
                                type: string
                              values:
                                type: array
                                items:
                                  type: integer
              example:
                data:
                - compared_to: '778899001123'
                  start: 1753900000
                  end: 1754500000
                  metrics:
                  - type: SENT
                    order: BASELINE_FIRST
                    values:
                    - 1200
                    - 980
                  - type: DELIVERED
                    order: BASELINE_FIRST
                    values:
                    - 1180
                    - 940
                  - type: READ
                    order: BASELINE_FIRST
                    values:
                    - 860
                    - 610
  "/meta/wabas/{wabaId}/templates/{templateIdOrName}":
    parameters:
    - "$ref": "#/components/parameters/WabaId"
    - name: templateIdOrName
      in: path
      required: true
      description: Use a template ID when editing and a template name when deleting.
      schema:
        type: string
    post:
      operationId: editTemplate
      summary: Edit a template
      description: Updates an existing template using its Meta template ID.
      tags:
      - Templates
      x-mint:
        href: "/api-reference/meta/operations/edit-template"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - components
              properties:
                components:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    - text
                    - example
                    properties:
                      type:
                        type: string
                      text:
                        type: string
                      example:
                        type: object
                        required:
                        - body_text
                        properties:
                          body_text:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
              description: |-
                ```json
                {
                  "components": [
                    {
                      "type": "BODY",
                      "text": "Hi {{1}}, your order has shipped.",
                      "example": {
                        "body_text": [
                          [
                            "Ravi"
                          ]
                        ]
                      }
                    }
                  ]
                }
                ```
            example:
              components:
              - type: BODY
                text: Hi {{1}}, your order has shipped.
                example:
                  body_text:
                  - - Ravi
      responses:
        '200':
          description: |-
            Edit submitted (template returns to review)

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `400` | Template not editable (`PENDING`, or edit limit reached), or `templateId` unknown | Only `APPROVED`/`REJECTED` templates can be edited, max 10 edits/month |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
              example:
                success: true
    delete:
      operationId: deleteTemplate
      summary: Delete a template
      description: Deletes every language variant with the supplied template name.
      tags:
      - Templates
      x-mint:
        href: "/api-reference/meta/operations/delete-template"
