        description: Meta template ID. When present, delete only this language variant.
        schema:
          type: string
      responses:
        '200':
          description: |-
            Template deleted

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `400` | Template name not found, or `hsmId` does not belong to that name | Confirm via `GET .../templates?name=` |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
              example:
                success: true
  "/meta/phone-numbers/{phoneNumberId}/media":
    post:
      operationId: uploadMedia
      summary: Upload media
      description: Uploads a media file to WhatsApp for later use in a message.
      tags:
      - Media
      x-mint:
        href: "/api-reference/meta/operations/upload-media"
        content: "<Note>WhatsApp limits apply: images 5 MB, documents 100 MB, video
          16 MB, and audio 16 MB.</Note>\n"
      parameters:
      - "$ref": "#/components/parameters/PhoneNumberId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              description: |-
                ```bash
                curl -X POST "https://cerberus.eazybe.com/meta/phone-numbers/5647382910/media" \
                  -H "Authorization: Bearer <jwt>" \
                  -F "file=@invoice.pdf"
                ```
      responses:
        '200':
          description: |-
            Media uploaded

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `phoneNumberId` not linked to your organization | Verify the id |
            | `400` | Unsupported MIME type or file over WhatsApp's size limit (image 5 MB, document 100 MB, video/audio 16 MB) | Re-encode or compress |
            | `500` | No `file` field in the multipart body | Send as `multipart/form-data` with field `file` |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
              example:
                id: '1234567890123456'
  "/meta/media/{mediaId}":
    parameters:
    - name: mediaId
      in: path
      required: true
      description: Media ID returned by the upload operation.
      schema:
        type: string
    - name: phoneNumberId
      in: query
      required: true
      description: Phone-number ID that owns the media.
      schema:
        type: string
    get:
      operationId: getMedia
      summary: Get media metadata
      description: Returns media metadata and a short-lived Meta download URL.
      tags:
      - Media
      x-mint:
        href: "/api-reference/meta/operations/get-media"
        content: "<Warning>The returned URL expires quickly and requires Meta authorization.
          Download it from your server instead of exposing it to a browser.</Warning>\n"
      responses:
        '200':
          description: |-
            Metadata returned

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `phoneNumberId` missing from the query or not linked to your organization | Always pass `?phoneNumberId=` |
            | `400` | `mediaId` unknown or already deleted | Re-upload the asset |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - mime_type
                - sha256
                - file_size
                - id
                - messaging_product
                properties:
                  url:
                    type: string
                  mime_type:
                    type: string
                  sha256:
                    type: string
                  file_size:
                    type: integer
                  id:
                    type: string
                  messaging_product:
                    type: string
              example:
                url: https://lookaside.fbsbx.com/whatsapp_business/attachments/?mid=1234567890123456&ext=1754500000&hash=ATtR2...
                mime_type: application/pdf
                sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                file_size: 84213
                id: '1234567890123456'
                messaging_product: whatsapp
    delete:
      operationId: deleteMedia
      summary: Delete media
      description: Permanently deletes an uploaded WhatsApp media asset.
      tags:
      - Media
      x-mint:
        href: "/api-reference/meta/operations/delete-media"
        content: "<Warning>Deletion cannot be undone. Confirm the media ID and owning
          phone-number ID before sending the request.</Warning>\n"
      responses:
        '200':
          description: |-
            Media deleted

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `phoneNumberId` missing from the query or not linked to your organization | Always pass `?phoneNumberId=` |
            | `400` | `mediaId` unknown or already deleted | Treat as already removed |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
              example:
                success: true
  "/meta/wabas/{wabaId}/webhook-subscriptions":
    parameters:
    - "$ref": "#/components/parameters/WabaId"
    get:
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: Returns the webhook subscriptions configured for a WABA.
      tags:
      - Webhooks
      x-mint:
        href: "/api-reference/meta/operations/list-webhook-subscriptions"
      responses:
        '200':
          description: |-
            Subscriptions returned (empty `data` = not subscribed)

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - whatsapp_business_api_data
                      - override_callback_uri
                      properties:
                        whatsapp_business_api_data:
                          type: object
                          required:
                          - id
                          - link
                          - name
                          properties:
                            id:
                              type: string
                            link:
                              type: string
                            name:
                              type: string
                        override_callback_uri:
                          type: string
              example:
                data:
                - whatsapp_business_api_data:
                    id: '9988776655'
                    link: https://www.facebook.com/games/?app_id=9988776655
                    name: Eazybe
                  override_callback_uri: https://your-app.com/webhooks/whatsapp
    post:
      operationId: createWebhookSubscription
      summary: Subscribe a WABA to webhooks
      description: |
        Subscribes the WABA to the default Eazybe callback or a custom callback.
        The callback must answer Meta's verification handshake with `hub.challenge`.
      tags:
      - Webhooks
      x-mint:
        href: "/api-reference/meta/operations/create-webhook-subscription"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - overrideCallbackUri
              - verifyToken
              properties:
                overrideCallbackUri:
                  type: string
                verifyToken:
                  type: string
              description: |-
                ```json
                {
                  "overrideCallbackUri": "https://your-app.com/webhooks/whatsapp",
                  "verifyToken": "shared-secret"
                }
                ```
            example:
              overrideCallbackUri: https://your-app.com/webhooks/whatsapp
              verifyToken: shared-secret
      responses:
        '200':
          description: |-
            App subscribed to this WABA's events

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `400` | Callback URL failed Meta's verification handshake, or is not HTTPS | Return `hub.challenge` on the `GET` handshake |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
              example:
                success: true
    delete:
      operationId: deleteWebhookSubscription
      summary: Unsubscribe a WABA from webhooks
      description: Removes the WABA's webhook subscription.
      tags:
      - Webhooks
      x-mint:
        href: "/api-reference/meta/operations/delete-webhook-subscription"
        content: "<Warning>Inbound message and delivery events stop after this subscription
          is removed.</Warning>\n"
      responses:
        '200':
          description: |-
            Unsubscribed — inbound events stop

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `400` | App was not subscribed | Treat as already unsubscribed |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
              example:
                success: true
