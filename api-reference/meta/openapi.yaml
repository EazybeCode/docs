  "/meta/wabas/{wabaId}/templates":
    get:
      operationId: listTemplates
      summary: List templates
      description: Returns one Meta page of message templates for a WABA.
      tags:
      - Templates
      x-mint:
        href: "/api-reference/meta/operations/list-templates"
      parameters:
      - "$ref": "#/components/parameters/WabaId"
      - "$ref": "#/components/parameters/PagingLimit"
      - "$ref": "#/components/parameters/PagingAfter"
      - name: name
        in: query
        required: false
        description: Filter by template name.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter by Meta template status.
        schema:
          type: string
      - "$ref": "#/components/parameters/Fields"
      responses:
        '200':
          description: |-
            Page returned

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `400` | Invalid query parameter or `fields` expression | Correct the query |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - paging
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - language
                      - status
                      - category
                      - components
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        language:
                          type: string
                        status:
                          type: string
                        category:
                          type: string
                        components:
                          type: array
                          items:
                            type: object
                            required:
                            - type
                            - text
                            properties:
                              type:
                                type: string
                              text:
                                type: string
                  paging:
                    type: object
                    required:
                    - cursors
                    - next
                    properties:
                      cursors:
                        type: object
                        required:
                        - before
                        - after
                        properties:
                          before:
                            type: string
                          after:
                            type: string
                      next:
                        type: string
              example:
                data:
                - id: '778899001122'
                  name: order_update
                  language: en
                  status: APPROVED
                  category: UTILITY
                  components:
                  - type: BODY
                    text: Hi {{1}}, your order is on its way.
                - id: '778899001123'
                  name: diwali_offer
                  language: en
                  status: APPROVED
                  category: MARKETING
                  components:
                  - type: BODY
                    text: Flat {{1}} off this Diwali.
                paging:
                  cursors:
                    before: MAZDZD
                    after: MjQZD
                  next: https://graph.facebook.com/v25.0/1029384756/message_templates?after=MjQZD
    post:
      operationId: createTemplate
      summary: Create a template
      description: Submits a new message template to Meta for approval.
      tags:
      - Templates
      x-mint:
        href: "/api-reference/meta/operations/create-template"
        content: "<Note>Approval is asynchronous. Poll the list endpoint or subscribe
          to the `message_template_status_update` webhook.</Note>\n"
      parameters:
      - "$ref": "#/components/parameters/WabaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - language
              - category
              - components
              properties:
                name:
                  type: string
                language:
                  type: string
                category:
                  type: string
                components:
                  type: array
                  items:
                    type: object
                    required:
                    - type
                    - format
                    - text
                    - example
                    properties:
                      type:
                        type: string
                      format:
                        type: string
                      text:
                        type: string
                      example:
                        type: object
                        required:
                        - header_text
                        properties:
                          header_text:
                            type: array
                            items:
                              type: string
              description: |-
                ```json
                {
                  "name": "order_update",
                  "language": "en",
                  "category": "UTILITY",
                  "components": [
                    {
                      "type": "HEADER",
                      "format": "TEXT",
                      "text": "Order {{1}}",
                      "example": {
                        "header_text": [
                          "A-1042"
                        ]
                      }
                    },
                    {
                      "type": "BODY",
                      "text": "Hi {{1}}, your order is on its way.",
                      "example": {
                        "body_text": [
                          [
                            "Ravi"
                          ]
                        ]
                      }
                    },
                    {
                      "type": "FOOTER",
                      "text": "Acme Retail"
                    }
                  ]
                }
                ```
            example:
              name: order_update
              language: en
              category: UTILITY
              components:
              - type: HEADER
                format: TEXT
                text: Order {{1}}
                example:
                  header_text:
                  - A-1042
              - type: BODY
                text: Hi {{1}}, your order is on its way.
                example:
                  body_text:
                  - - Ravi
              - type: FOOTER
                text: Acme Retail
      responses:
        '200':
          description: |-
            Template submitted for review

            **Failure responses**

            | **Status** | **Meaning** | **Action** |
            | --- | --- | --- |
            | `401` | Missing, invalid, or expired bearer token | Re-authenticate |
            | `404` | `wabaId` not linked to your organization | Verify the id |
            | `400` | Duplicate name+language, missing `example` values, invalid category, or malformed components | Read `error.error_user_msg` |
            | `502` | Graph unreachable or timed out | Retry with backoff |
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - category
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  category:
                    type: string
              example:
                id: '778899001125'
                status: PENDING
                category: UTILITY
  "/meta/wabas/{wabaId}/templates/all":
